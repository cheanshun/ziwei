<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题刷题系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7C66'/%3E%3Cpath d='M18 33l10 10 18-20' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F3F5F4;
    --card:#FFFFFF;
    --ink:#1F2933;
    --ink-2:#5B6770;
    --ink-3:#8A9499;
    --line:#E2E7E5;
    --brand:#0E7C66;
    --brand-deep:#0A5C4C;
    --brand-soft:#E3F0EC;
    --ok:#158A5E;
    --ok-soft:#E4F3EC;
    --bad:#D64545;
    --bad-soft:#FBEAEA;
    --warn:#B7791F;
    --warn-soft:#FBF3E2;
    --single:#2563EB;
    --single-soft:#E8EFFC;
    --multi:#C2701B;
    --multi-soft:#F9EEDF;
    --judge:#0E7C66;
    --judge-soft:#E3F0EC;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,32,38,.05), 0 4px 16px rgba(16,32,38,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;
  }
  button{font-family:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 64px}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-logo{width:38px;height:38px;flex:none;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.5px;line-height:1.3}
  .brand p{font-size:12px;color:var(--ink-3);line-height:1.3}
  .tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  .tab{
    display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;
    padding:7px 13px;border-radius:10px;font-size:14px;color:var(--ink-2);cursor:pointer;transition:all .15s;
  }
  .tab:hover{background:#EEF2F0;color:var(--ink)}
  .tab.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
  .tab svg{width:17px;height:17px;flex:none}

  /* ===== 通用卡片 / 按钮 ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
  .card + .card{margin-top:16px}
  .muted{color:var(--ink-2)}
  .small{font-size:13px}
  .spacer{flex:1}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
    border-radius:10px;padding:9px 18px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .15s;line-height:1.4;
  }
  .btn svg{width:16px;height:16px;flex:none}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-deep)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:#C9D3CF;background:#FAFBFA}
  .btn-danger{background:#fff;border-color:#E5C3C3;color:var(--bad)}
  .btn-danger:hover{background:var(--bad-soft)}
  .btn-lg{padding:11px 24px;font-size:15.5px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .select{
    width:100%;max-width:340px;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;
    font-size:14.5px;background:#fff;color:var(--ink);
  }
  .select:focus{outline:none;border-color:var(--brand)}
  .text-input{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#fff;color:var(--ink)}
  .text-input:focus{outline:none;border-color:var(--brand)}

  /* ===== 视图标题 ===== */
  .view-title{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px}
  .view-title h2{font-size:20px;font-weight:700}
  .view-title .muted{font-size:13.5px}

  /* ===== 徽标 ===== */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
  .badge-single{background:var(--single-soft);color:var(--single)}
  .badge-multiple{background:var(--multi-soft);color:var(--multi)}
  .badge-judge{background:var(--judge-soft);color:var(--judge)}
  .badge-pass{background:var(--ok-soft);color:var(--ok)}
  .badge-fail{background:var(--bad-soft);color:var(--bad)}

  /* ===== 考试设置 ===== */
  .rule-strip{
    display:flex;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border:1px solid #CFE5DD;
    border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--brand-deep);margin-bottom:16px;
  }
  .rule-strip span{white-space:nowrap}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .setting-row:last-child{border-bottom:none}
  .setting-label{font-weight:600;font-size:14.5px}
  .setting-desc{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .setting-ctl{display:flex;align-items:center;gap:12px}
  .num-input{width:76px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:14.5px;text-align:center}
  .num-input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
  .switch{position:relative;width:44px;height:25px;flex:none;cursor:pointer}
  .switch input{opacity:0;width:0;height:0}
  .switch .track{position:absolute;inset:0;background:#CBD5D1;border-radius:20px;transition:background .15s}
  .switch .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + .track{background:var(--brand)}
  .switch input:checked + .track + .knob{transform:translateX(19px)}
  .bank-note{font-size:13px;color:var(--ink-3);margin-top:10px}

  /* ===== 考试进行中 ===== */
  .exam-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .exam-count{font-size:14px;font-weight:700}
  .exam-count b{font-size:17px;color:var(--brand)}
  .progress{flex:1;min-width:120px;height:8px;background:#E7ECEA;border-radius:6px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .2s}
  .q-body{margin-top:6px}
  .q-text{font-size:16.5px;font-weight:600;line-height:1.7;margin-bottom:16px}
  .q-tip{font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
    border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 14px;
    font-size:15px;color:var(--ink);cursor:pointer;margin-bottom:9px;transition:all .12s;line-height:1.55;
  }
  .opt:hover{border-color:#A9C4BB}
  .opt-key{
    flex:none;width:24px;height:24px;border-radius:7px;background:#F0F3F2;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px;
  }
  .opt.selected{border-color:var(--brand);background:var(--brand-soft)}
  .opt.selected .opt-key{background:var(--brand);color:#fff}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .opt-key{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .opt-key{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .opt:disabled:hover{border-color:var(--line)}
  .exam-foot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .exam-foot .spacer{flex:1}
  .palette{
    display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:16px;
    padding-top:16px;border-top:1px dashed var(--line);
  }
  .p-num{
    height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;
  }
  .p-num:hover{border-color:#A9C4BB}
  .p-num.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
  .p-num.cur{border-color:var(--brand);color:var(--brand);font-weight:700;box-shadow:0 0 0 3px var(--brand-soft)}
  .palette-tip{font-size:12.5px;color:var(--ink-3);margin-top:9px}

  /* ===== 成绩结果 ===== */
  .result-top{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .donut-wrap{position:relative;width:150px;height:150px;flex:none}
  .donut-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .donut-bg{fill:none;stroke:#E7ECEA;stroke-width:11}
  .donut-fg{fill:none;stroke:var(--ok);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
  .donut-fg.fail{stroke:var(--bad)}
  .donut-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .donut-num b{font-size:34px;font-weight:800;line-height:1}
  .donut-num span{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .result-info{flex:1;min-width:230px}
  .result-info h3{font-size:22px;font-weight:800;margin-bottom:4px}
  .result-info h3.pass{color:var(--ok)}
  .result-info h3.fail{color:var(--bad)}
  .result-info .sub{color:var(--ink-2);font-size:14px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .stat-cell{background:#F7F9F8;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}
  .stat-cell b{display:block;font-size:21px;font-weight:800;color:var(--brand-deep)}
  .stat-cell span{font-size:12.5px;color:var(--ink-3)}
  .review-item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;background:#fff}
  .review-q{font-weight:600;font-size:15px;line-height:1.65;margin:8px 0 10px}
  .review-row{display:flex;gap:8px;font-size:14px;padding:4px 0;flex-wrap:wrap}
  .review-row .tag{flex:none;min-width:66px;font-weight:700;font-size:13px;color:var(--ink-3)}
  .review-row .val{color:var(--ink)}
  .review-row .val.right{color:var(--ok);font-weight:600}
  .review-row .val.miss{color:var(--bad);font-weight:600}
  .review-explain{background:#F7F9F8;border-radius:9px;padding:10px 12px;font-size:13.5px;color:var(--ink-2);margin-top:8px}
  .review-explain b{color:var(--brand-deep)}
  .result-actions{margin-top:20px}

  /* ===== 刷题练习 ===== */
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filter-row .select{width:auto;max-width:260px}
  .chip{border:1.5px solid var(--line);background:#fff;padding:6px 14px;border-radius:20px;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:all .12s}
  .chip:hover{border-color:#A9C4BB}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .search-box{flex:1;min-width:180px;position:relative}
  .search-box input{width:100%;padding:8px 12px 8px 34px;border:1.5px solid var(--line);border-radius:20px;font-size:13.5px;background:#fff}
  .search-box input:focus{outline:none;border-color:var(--brand)}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
  .p-stat{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-bottom:14px;padding:12px 16px;background:#fff;border:1px solid var(--line);border-radius:11px}
  .p-stat b{color:var(--brand-deep);font-size:15px}
  .p-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:13px;background:#fff}
  .p-card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .p-num-tag{font-size:12px;color:var(--ink-3);font-weight:600}
  .p-card .q-text{font-size:15.5px;margin-bottom:12px}
  .p-feedback{margin-top:11px;border-radius:10px;padding:11px 14px;font-size:14px;line-height:1.7}
  .p-feedback.right{background:var(--ok-soft);color:#0F6B48;border:1px solid #C4E4D4}
  .p-feedback.wrong{background:var(--bad-soft);color:#A23A3A;border:1px solid #F0CFCF}
  .p-feedback b{font-weight:700}
  .p-empty{text-align:center;color:var(--ink-3);padding:46px 0;font-size:14.5px}
  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px;flex-wrap:wrap}
  .pager-info{font-size:13.5px;color:var(--ink-2);font-weight:600}
  .pager .btn[disabled]{opacity:.45;cursor:not-allowed}

  /* ===== 题库管理：锁屏 / 面板 ===== */
  .lock-panel{max-width:460px;margin:10px auto}
  .lock-icon{width:58px;height:58px;border-radius:17px;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .lock-icon svg{width:28px;height:28px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .lock-note{font-size:12.5px;color:var(--ink-3);margin-top:12px;line-height:1.7}
  .bank-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .bank-head h2{font-size:17px;font-weight:700}
  .bank-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px 15px;background:#fff;margin-bottom:9px;flex-wrap:wrap}
  .bank-item .name{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
  .bank-item .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .bank-item .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .tag-default{display:inline-block;background:var(--brand-soft);color:var(--brand-deep);font-size:11.5px;padding:1px 8px;border-radius:10px;font-weight:600}
  .upload-zone{border:1.5px dashed #C6D4CE;border-radius:11px;padding:16px;text-align:center;color:var(--ink-3);background:#FAFCFB;font-size:13.5px;margin-bottom:12px}
  .upload-zone strong{color:var(--brand-deep)}
  .json-input{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:13px;font-family:Consolas,"Courier New",monospace;background:#FBFCFB;color:var(--ink);resize:vertical}
  .json-input:focus{outline:none;border-color:var(--brand)}
  .edit-q-card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;background:#fff}
  .edit-q-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .edit-q-head b{font-size:15px}
  .edit-opt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .edit-opt-row .text-input{flex:1}
  .edit-opt-row input[type=radio],.edit-opt-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);flex:none}
  .edit-search-row{display:flex;align-items:center;gap:12px}
  .edit-search-row .text-input{flex:1}
  .bank-check-list{display:flex;flex-wrap:wrap;gap:8px}
  .bank-check{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;background:#fff;font-size:13.5px;cursor:pointer;transition:border-color .15s,background .15s}
  .bank-check:hover{border-color:var(--brand)}
  .bank-check.on{border-color:var(--brand);background:var(--brand-soft)}
  .bank-check input{width:16px;height:16px;accent-color:var(--brand);margin:0}
  .bank-check .n{color:var(--ink-3);font-size:12px}
  .import-msg{margin-top:10px;font-size:13.5px;border-radius:9px;padding:10px 13px;display:none}
  .import-msg.ok{display:block;background:var(--ok-soft);color:#0F6B48}
  .import-msg.err{display:block;background:var(--bad-soft);color:#A23A3A}
  .import-msg.warn{display:block;background:var(--warn-soft);color:#8A5B14}

  /* ===== 成绩记录 ===== */
  .h-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .h-item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:11px;padding:13px 16px;background:#fff;margin-bottom:10px;flex-wrap:wrap}
  .h-score{flex:none;width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .h-score.pass{background:var(--ok)}
  .h-score.fail{background:var(--bad)}
  .h-score b{font-size:17px;line-height:1.1}
  .h-score span{font-size:10.5px;opacity:.85}
  .h-meta{flex:1;min-width:180px}
  .h-meta .t{font-size:13px;color:var(--ink-3)}
  .h-meta .d{font-size:14.5px;font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:5px;height:52px;margin-top:14px}
  .bars .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .bars .bar{width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--brand)}
  .bars .bar.fail{background:var(--bad)}
  .bars .bar-label{font-size:10px;color:var(--ink-3);white-space:nowrap;transform:scale(.9)}
  .h-empty{text-align:center;color:var(--ink-3);padding:44px 0;font-size:14.5px}

  /* ===== 闯关系统 ===== */
  .level-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .level-progress-wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .level-progress{flex:1;min-width:200px;height:12px;background:#E7ECEA;border-radius:8px;overflow:hidden;display:flex}
  .level-progress i{display:block;height:100%;background:var(--brand);border-radius:8px;transition:width .3s}
  .level-progress-num{font-size:13.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}
  .lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px}
  .lvl-card{
    position:relative;border:1.5px solid var(--line);border-radius:14px;padding:18px 14px 14px;text-align:center;
    background:#fff;cursor:pointer;transition:all .15s;overflow:hidden;
  }
  .lvl-card:hover{border-color:#A9C4BB;transform:translateY(-2px);box-shadow:var(--shadow)}
  .lvl-card.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.5)}
  .lvl-card.locked:hover{transform:none;border-color:var(--line);box-shadow:none}
  .lvl-card.current{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .lvl-icon{width:54px;height:54px;border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;color:#fff}
  .lvl-icon svg{width:28px;height:28px}
  .lvl-name{font-size:16px;font-weight:800;letter-spacing:1px}
  .lvl-title{font-size:12px;color:var(--ink-3);margin-top:2px}
  .lvl-meta{font-size:12px;color:var(--ink-2);margin-top:8px}
  .lvl-best{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--brand-deep)}
  .lvl-status{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:12px}
  .lvl-status.done{background:var(--ok-soft);color:var(--ok)}
  .lvl-status.todo{background:var(--warn-soft);color:var(--warn)}
  .lvl-status.locked{background:#EEF1F0;color:var(--ink-3)}
  .lvl-c0{background:linear-gradient(135deg,#9C6B3F,#B98454)}
  .lvl-c1{background:linear-gradient(135deg,#8E9AA6,#B7C3CF)}
  .lvl-c2{background:linear-gradient(135deg,#C9A227,#E5C158)}
  .lvl-c3{background:linear-gradient(135deg,#7E8B99,#A8B6C4)}
  .lvl-c4{background:linear-gradient(135deg,#2E8FD6,#5FB6EE)}

  .rank-good{background:#e2f5ec;color:#158a5e}
  .rank-mid{background:#e7f0fb;color:#2e8fd6}
  .rank-pass{background:#e9f7e9;color:#2e9e2e}

  .congrats-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .confetti{position:relative;height:6px;margin-bottom:16px;display:flex;justify-content:center;gap:8px}
  .confetti i{width:9px;height:9px;border-radius:2px;display:block;animation:conf 1.1s ease-in-out infinite alternate}
  @keyframes conf{from{transform:translateY(0) rotate(0)}to{transform:translateY(-10px) rotate(180deg)}}

  /* ===== 整站访问锁（全屏遮罩） ===== */
  .app-lock{
    position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#F3F8F5 0%,#E8F1EC 60%,#DCEAE3 100%);padding:20px;
  }
  .app-lock .card{max-width:440px;width:100%;padding:30px 26px;box-shadow:0 14px 44px rgba(31,73,60,.14)}
  .app-lock h1{font-size:20px;font-weight:800;text-align:center;margin:0 0 4px;color:var(--ink)}
  .app-lock .sub{text-align:center;font-size:13.5px;color:var(--ink-3);margin:0 0 20px;line-height:1.7}

  /* ===== Toast ===== */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
    background:#1F2933;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.22);max-width:86vw;text-align:center;
  }

  @media (max-width:720px){
    body{font-size:16px}
    .topbar-inner{gap:10px}
    .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;margin-left:0}
    .tab{flex:none;min-height:44px}
    input,textarea{font-size:16px}
    .num-input{font-size:16px}
    .palette{grid-template-columns:repeat(6,1fr)}
    .stat-grid,.bank-stats,.h-stats{grid-template-columns:repeat(2,1fr)}
    .result-top{justify-content:center;text-align:center}
    .result-info{text-align:center}
    .result-actions{justify-content:center}
    .donut-wrap{margin:0 auto}
    .setting-row{flex-direction:column;align-items:flex-start;gap:8px}
    .bank-item .acts{margin-left:0;width:100%}
  }
</style>
</head>

<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
 * 数据：内置题库（中州派紫微斗数深造讲义，2597 题）
 * 题库 JSON 结构：{ "title": "题库名", "questions": [ { "id":"q1",
 *   "type":"single|multiple|judge", "text":"题干", "options":["选项A","选项B",...],
 *   "answer":[0], "explain":"解析（可空）" } ] }
 * answer 为正确选项的下标数组：单选/判断 1 个下标，多选多个下标。
 * ===================================================================== */


/* ===== 存储 ===== */
const LS = {
  get: function(k, fb){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const K_BANKS = "quiz.banks.v2";
const K_SETTINGS = "quiz.settings.v1";
const K_HISTORY = "quiz.history.v1";
const K_PRACTICE = "quiz.practice.v1";
const K_LOCK = "quiz.lock.v1";
const K_APP_LOCK = "quiz.applock.v1";
const K_LEVEL = "quiz.level.v1";
const K_SEL_BANKS = "quiz.selbanks.v1";
const K_OLD_BANK = "quiz.bank.v1";

/* ===== 闯关配置：七级难度递增 ===== */
const LEVELS = [
  { name: "青铜", title: "初入门径", count: 25, multi: 0,   ratio: "全单选+判断" },
  { name: "白银", title: "小试牛刀", count: 30, multi: 2,   ratio: "含 2 道多选" },
  { name: "黄金", title: "渐入佳境", count: 35, multi: 4,   ratio: "含 4 道多选" },
  { name: "白金", title: "炉火纯青", count: 40, multi: 6,   ratio: "含 6 道多选" },
  { name: "钻石", title: "登峰造极", count: 45, multi: 8,   ratio: "含 8 道多选" },
  { name: "星曜", title: "星曜临身", count: 50, multi: 10,  ratio: "含 10 道多选" },
  { name: "王者", title: "独步斗数", count: 60, multi: 12,  ratio: "含 12 道多选" }
];

/* ===== 题库加载（本地题库 + 远程仓库题库） ===== */
function loadBanks(){
  var banks = LS.get(K_BANKS, null);
  if(Array.isArray(banks)){
    banks = banks.filter(function(b){ return !isRemoteBank(b); });
    if(banks.length) return banks;
  }
  var old = LS.get(K_OLD_BANK, null);
  if(old && Array.isArray(old.questions) && old.questions.length){
    var nb = { id: uid(), title: old.title || "我的题库", questions: old.questions };
    LS.set(K_BANKS, [nb]);
    return [nb];
  }
  return [];
}

/* ===== 远程题库（GitHub 仓库托管，管理员控制开放/卸载） ===== */
const REMOTE_DEFAULT = "https://cheanshun.github.io/ziwei/banks/manifest.json";
const REMOTE_PREFIX = "remote:";
function isRemoteBank(b){ return b && typeof b.id === "string" && b.id.indexOf(REMOTE_PREFIX) === 0; }
function localBankCount(){ var n = 0; state.banks.forEach(function(b){ if(!isRemoteBank(b)) n++; }); return n; }
function removeRemoteBanks(){ state.banks = state.banks.filter(function(b){ return !isRemoteBank(b); }); }
function remoteManifestUrl(){
  var s = state.settings.remoteManifestUrl;
  if(s && String(s).trim()) return String(s).trim();
  var h = location.hostname || "";
  if(h === "localhost" || /\.github\.io$/.test(h)) return "banks/manifest.json";
  return REMOTE_DEFAULT;
}
function remoteRepoBanksUrl(){
  var u = remoteManifestUrl();
  var m = u.match(/^https:\/\/([^\/]+)\.github\.io\/([^\/]+)\/banks\/manifest\.json/);
  if(m) return "https://github.com/" + m[1] + "/" + m[2] + "/tree/main/banks";
  var m2 = u.match(/github\.com\/([^\/]+)\/([^\/]+)\/banks\/manifest\.json/);
  if(m2) return "https://github.com/" + m2[1] + "/" + m2[2] + "/tree/main/banks";
  return "https://github.com";
}
function fetchText(url){
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  });
}
function loadRemoteBanks(){
  var url = remoteManifestUrl();
  state.remote.status = "loading";
  state.remote.err = "";
  removeRemoteBanks();
  renderRemoteBar();
  var tryFetch = function(u){
    return fetchText(u).catch(function(e){
      if(u.indexOf("http") !== 0) return fetchText(REMOTE_DEFAULT);
      throw e;
    });
  };
  tryFetch(url).then(function(text){
    var manifest;
    try { manifest = JSON.parse(text); }
    catch(e){ throw new Error("manifest 不是有效 JSON"); }
    state.remote.manifestUrl = url;
    var base = url.substring(0, url.lastIndexOf("/") + 1);
    var tasks = (manifest.banks || []).filter(function(b){ return b && b.enabled; }).map(function(b){
      return fetchText(base + b.file).then(function(t){
        var obj;
        try { obj = JSON.parse(t); } catch(e){ throw new Error("题库「" + (b.title || b.file) + "」JSON 解析失败"); }
        var v = validateBank(obj);
        if(!v.ok) throw new Error("题库「" + (b.title || b.file) + "」格式错误：" + v.err);
        return { id: REMOTE_PREFIX + b.id, title: v.title, questions: v.questions, remote: true, remoteFile: b.file };
      });
    });
    return Promise.all(tasks);
  }).then(function(banks){
    banks.forEach(function(b){
      state.banks = state.banks.filter(function(x){ return x.id !== b.id; });
      state.banks.unshift(b);
    });
    state.remote.status = "ok";
    if(!state.selectedBankId || !getBankById(state.selectedBankId)) state.selectedBankId = state.banks.length ? state.banks[0].id : null;
    renderRemoteBar();
    refreshAllViews();
  }).catch(function(e){
    state.remote.status = "err";
    state.remote.err = String(e && e.message ? e.message : e);
    renderRemoteBar();
  });
}
function refreshAllViews(){
  renderExamSetup();
  if(!document.getElementById("view-level").hidden) renderLevelBox();
  if(!document.getElementById("view-practice").hidden) renderPracticeBox();
  if(!document.getElementById("view-bank").hidden) renderBankBox();
}
function renderRemoteBar(){
  var el = document.getElementById("remote-bar");
  if(!el) return;
  var r = state.remote;
  var h = "";
  if(r.status === "loading"){
    h += '<div class="p-empty">正在从仓库加载题库…</div>';
  } else if(r.status === "err"){
    h += '<div class="p-empty" style="color:var(--bad)">远程题库加载失败：' + esc(r.err) + '</div>';
    h += '<div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" id="btn-remote-refresh">重新加载</button></div>';
  } else {
    var list = state.banks.filter(isRemoteBank);
    if(!list.length){
      h += '<div class="p-empty">仓库 manifest 中当前没有启用的题库。<br>启用方式：在仓库 banks/manifest.json 中把条目 enabled 设为 true，或在 banks/ 目录添加题库文件并登记到 manifest，然后点「刷新」。</div>';
      h += '<div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" id="btn-remote-refresh">刷新远程题库</button><button class="btn btn-ghost" id="btn-remote-open">打开仓库 banks 目录</button></div>';
    } else {
      h += '<div class="bank-list">';
      list.forEach(function(b){
        var c = { single: 0, multiple: 0, judge: 0 };
        b.questions.forEach(function(q){ c[q.type]++; });
        h += '<div class="bank-item"><div><div class="name">' + esc(b.title) + ' <span class="tag-default">仓库</span></div>';
        h += '<div class="meta">共 ' + b.questions.length + " 题 · 单选 " + c.single + " · 多选 " + c.multiple + " · 判断 " + c.judge + ' · 文件 ' + esc(b.remoteFile || "") + "</div></div>";
        h += '<div class="acts"><span class="muted" style="font-size:12.5px">只读 · 由仓库控制</span></div></div>';
      });
      h += '</div>';
      h += '<div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" id="btn-remote-refresh">刷新远程题库</button><button class="btn btn-ghost" id="btn-remote-open">打开仓库 banks 目录</button></div>';
    }
  }
  el.innerHTML = h;
  var rf = document.getElementById("btn-remote-refresh");
  if(rf) rf.addEventListener("click", function(){ loadRemoteBanks(); });
  var op = document.getElementById("btn-remote-open");
  if(op) op.addEventListener("click", function(){ window.open(remoteRepoBanksUrl(), "_blank"); });
}

/* ===== 全局状态 ===== */
const state = {
  banks: loadBanks(),
  remote: { status: "idle", err: "", manifestUrl: null },
  settings: Object.assign({ examCount: 20, shuffleQ: true, shuffleOpt: true, defaultBankId: null }, LS.get(K_SETTINGS, {})),
  history: LS.get(K_HISTORY, []),
  practice: LS.get(K_PRACTICE, {}),
  selectedBankId: null,
  exam: null,
  examStage: "setup",
  lastAtt: null,
  practiceFilter: "all",
  practiceKeyword: "",
  practicePage: 0,
  unlocked: false,
  bankEditId: null,
  bankEditKw: "",
  bankEditPage: 0,
  selectedBankIds: LS.get(K_SEL_BANKS, []),
  level: LS.get(K_LEVEL, {}),
  levelStage: "map",
  levelExam: null,
  levelScore: 0
};

function currentBank(){
  if(!state.banks.length) return null;
  for(var i = 0; i < state.banks.length; i++){
    if(state.banks[i].id === state.selectedBankId) return state.banks[i];
  }
  return state.banks[0];
}
/* 组卷使用的题库：优先 selectedBankIds，否则回退当前题库 */
function selectedBanks(){
  var ids = state.selectedBankIds || [];
  var out = [];
  ids.forEach(function(id){
    var b = getBankById(id);
    if(b && b.questions.length) out.push(b);
  });
  if(!out.length){
    var cb = currentBank();
    if(cb && cb.questions.length) out.push(cb);
  }
  return out;
}
function getBankById(id){
  for(var i = 0; i < state.banks.length; i++){
    if(state.banks[i].id === id) return state.banks[i];
  }
  return null;
}
function saveBanks(){ LS.set(K_BANKS, state.banks.filter(function(x){ return !isRemoteBank(x); })); }
function savePractice(){ LS.set(K_PRACTICE, state.practice); }
function saveSettings(){ LS.set(K_SETTINGS, state.settings); }
function saveHistory(){ LS.set(K_HISTORY, state.history); }
function saveLevel(){ LS.set(K_LEVEL, state.level); }

/* ===== 管理密码（本地散列，前端锁） ===== */
function hashPass(pw){
  var h = 5381;
  for(var i = 0; i < pw.length; i++){ h = ((h << 5) + h + pw.charCodeAt(i)) >>> 0; }
  return "h" + h.toString(36);
}
/* ===== 外部全局密码配置（config.json） =====
 * 把 index.html 部署到网站（与外网访客同一地址）时，同目录放一个 config.json：
 *   { "appPass": "zzdp2026", "adminPass": "admin2026" }
 * 密码是明文、可直接改：管理员在服务器/NAS/共享目录里直接编辑 config.json，
 * 把密码文字改掉保存，外网所有访客立即改用新密码，旧密码失效。
 * 也可在界面「访问锁设置 / 管理密码设置」里改密码，页面会自动生成新的
 * config.json 内容（一键复制）并触发下载，覆盖到网站目录即可。
 * 本机直接打开文件（file:// 读取不到 config.json）时，自动回退到内置出厂密码。
 * 密码验证优先级：本机 localStorage 覆盖 → config.json 全局 → 出厂内置。
 * ===================================================================== */
var EXTERNAL_CONFIG = "config.json";
var externalHashes = null; // 内存缓存：{ app: "哈希", admin: "哈希" }
var externalPlain = null;  // 内存缓存明文：{ app: "明文", admin: "明文" }
function currentAppHash(){ return (externalHashes && externalHashes.app) || BUILTIN_APP_HASH; }
function currentAdminHash(){ return (externalHashes && externalHashes.admin) || BUILTIN_ADMIN_HASH; }
function currentAppPlain(){ return (externalPlain && externalPlain.app) || "zzdp2026"; }
function currentAdminPlain(){ return (externalPlain && externalPlain.admin) || "admin2026"; }
function loadExternalConfig(){
  try{
    if(!window.fetch) return;
    fetch(EXTERNAL_CONFIG + "?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("cfg"); return r.json(); })
      .then(function(j){
        if(!j || typeof j !== "object") return;
        var h = {}, pl = {};
        if(j.appPassHash){ h.app = String(j.appPassHash); }            // 兼容旧哈希格式
        else if(j.appPass){ h.app = hashPass(String(j.appPass)); pl.app = String(j.appPass); }
        if(j.adminPassHash){ h.admin = String(j.adminPassHash); }      // 兼容旧哈希格式
        else if(j.adminPass){ h.admin = hashPass(String(j.adminPass)); pl.admin = String(j.adminPass); }
        if(h.app || h.admin){ externalHashes = h; externalPlain = pl; }
        var box = document.getElementById("app-lock");
        if(box && !box.hidden) renderAppLock();
      })
      .catch(function(){ /* 读取失败保持出厂密码 */ });
  }catch(e){}
}
function buildConfigText(appPlain, adminPlain){
  return JSON.stringify({ appPass: appPlain, adminPass: adminPlain }, null, 2);
}
function downloadConfig(appPlain, adminPlain){
  var blob = new Blob([buildConfigText(appPlain, adminPlain)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = EXTERNAL_CONFIG;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ===== 管理锁（管理员密码，出厂内置 + 全局配置） =====

 * ===================================================================== */
const BUILTIN_ADMIN_HASH = "h9j057c";
function getLock(){ return LS.get(K_LOCK, null); }
function hasLock(){ return true; } // 管理员出厂密码内置，管理锁永远存在
function setLock(pw){ LS.set(K_LOCK, { hash: hashPass(pw) }); }
function clearLock(){ LS.set(K_LOCK, null); }
function checkLock(pw){
  var h = hashPass(pw);

  if(l && l.hash) return l.hash === h;                 // 本机覆盖的管理密码优先
  if(externalHashes && externalHashes.admin) return externalHashes.admin === h; // 全局配置
  return BUILTIN_ADMIN_HASH === h;                     // 否则用出厂管理员密码

/* ===== 工具函数 ===== */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function shuffle(arr){ for(var i = arr.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
function uid(){ return "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtScore(n){ return String(parseFloat(n.toFixed(1))); }
function fmtTime(t){ var d = new Date(t); function p(x){ return (x < 10 ? "0" : "") + x; } return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); }
function typeName(t){ return t === "single" ? "单选题" : t === "multiple" ? "多选题" : "判断题"; }
function typeBadge(t){ return '<span class="badge badge-' + t + '">' + typeName(t) + "</span>"; }
function letter(i){ return String.fromCharCode(65 + i); }

function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.hidden = true; }, 2300);
}

/* 判分：多选需所选集合与正确答案完全一致才得分 */
function isCorrect(q, sel){
  if(!Array.isArray(sel)) return false;
  var ans = q.answer.slice().sort(function(a,b){ return a - b; });
  var s = sel.slice().sort(function(a,b){ return a - b; });
  if(ans.length !== s.length) return false;
  for(var i = 0; i < ans.length; i++){ if(ans[i] !== s[i]) return false; }
  return true;
}

/* 生成一次考试：多题库组卷 + 题目乱序 + 选项乱序（同步重映射答案下标） */
function buildExam(){
  var banks = selectedBanks();
  if(!banks.length || !banks.some(function(b){ return b.questions.length; })) return null;
  var s = state.settings;
  var src = [];
  banks.forEach(function(b){ src = src.concat(b.questions); });
  if(s.shuffleQ) shuffle(src);
  var qs = src.slice(0, Math.min(Math.max(1, s.examCount | 0), src.length));
  if(s.shuffleOpt){
    qs = qs.map(function(q){
      var items = q.options.map(function(text, i){ return { text: text, i: i }; });
      shuffle(items);
      var opts = [], map = {}, om = [];
      items.forEach(function(it, ni){ map[it.i] = ni; om[ni] = it.i; opts.push(it.text); });
      return { id: q.id, type: q.type, text: q.text, options: opts, answer: q.answer.map(function(i){ return map[i]; }).sort(function(a,b){ return a - b; }), om: om, explain: q.explain || "" };
    });
  }
  return { bankIds: banks.map(function(b){ return b.id; }), bankTitle: banks.map(function(b){ return b.title; }).join(" + "), questions: qs, answers: qs.map(function(){ return []; }), idx: 0 };
}

/* =====================================================================
 * 视图：模拟考试（设置 / 进行中 / 结果）
 * ===================================================================== */
const PASS_LINE = 60;
function scoreRank(sc){
  if(sc >= 90) return { name: "优秀", cls: "ex" };
  if(sc >= 80) return { name: "良好", cls: "good" };
  if(sc >= 70) return { name: "中等", cls: "mid" };
  if(sc >= PASS_LINE) return { name: "及格", cls: "pass" };
  return { name: "不及格", cls: "fail" };
}

function updateBankName(){
  var el = document.getElementById("exam-bank-name");
  var banks = selectedBanks();
  if(el) el.textContent = banks.length ? "组卷：" + banks.map(function(b){ return b.title; }).join(" + ") : "";
}

function bankSelectHTML(selId){
  return '<select class="select" id="' + selId + '">' + state.banks.map(function(b){
    return '<option value="' + esc(b.id) + '"' + (b.id === state.selectedBankId ? " selected" : "") + ">" + esc(b.title) + "（" + b.questions.length + " 题）</option>";
  }).join("") + "</select>";
}

/* 组卷多选题库：勾选式卡片 */
function bankMultiSelectHTML(){
  var ids = state.selectedBankIds || [];
  return '<div class="bank-check-list">' + state.banks.map(function(b){
    var on = ids.indexOf(b.id) >= 0;
    return '<label class="bank-check' + (on ? " on" : "") + '"><input type="checkbox" data-bank-id="' + esc(b.id) + '"' + (on ? " checked" : "") + '>' +
           esc(b.title) + '<span class="n">' + b.questions.length + ' 题</span></label>';
  }).join("") + "</div>";
}

function renderExamSetup(){
  var banks = selectedBanks();
  var n = banks.reduce(function(s, b){ return s + b.questions.length; }, 0);
  var maxN = Math.max(1, n);
  var h = "";
  h += '<div class="card">';
  h += '<div class="rule-strip"><span>满分 100 分</span><span>·</span><span>每题等分</span><span>·</span><span><b>60 分及格</b></span><span>·</span><span>不及格需重新答题</span><span>·</span><span>多选须全部选对</span></div>';
  h += '<div class="setting-row"><div><div class="setting-label">组卷题库（可多选）</div><div class="setting-desc">勾选多个题库，从全部勾选题库中随机抽题组成一份试卷</div></div>';
  h += '<div class="setting-ctl" style="max-width:520px">' + bankMultiSelectHTML() + "</div></div>";
  h += '<div class="setting-row"><div><div class="setting-label">考试题数</div><div class="setting-desc">' + (n > 0 ? "已选题库共 " + n + " 题，考试随机抽取，每题 " + fmtScore(100 / Math.min(maxN, Math.max(1, state.settings.examCount))) + " 分（按实际题数自动折算）" : "当前无可用题库") + "</div></div>";
  h += '<div class="setting-ctl"><input class="num-input" id="exam-count" type="number" min="1" max="' + maxN + '" value="' + Math.min(state.settings.examCount, maxN) + '"' + (n === 0 ? " disabled" : "") + '><span class="muted small">题</span></div></div>';
  h += '<div class="setting-row"><div><div class="setting-label">题目乱序</div><div class="setting-desc">每次考试打乱题目顺序</div></div>';
  h += '<label class="switch"><input type="checkbox" id="opt-shuffle-q" ' + (state.settings.shuffleQ ? "checked" : "") + '><span class="track"></span><span class="knob"></span></label></div>';
  h += '<div class="setting-row"><div><div class="setting-label">选项乱序</div><div class="setting-desc">每题选项顺序随机打乱</div></div>';
  h += '<label class="switch"><input type="checkbox" id="opt-shuffle-o" ' + (state.settings.shuffleOpt ? "checked" : "") + '><span class="track"></span><span class="knob"></span></label></div>';
  h += '<div class="btn-row" style="margin-top:18px"><button class="btn btn-primary btn-lg" id="btn-start-exam"' + (n === 0 ? " disabled" : "") + ">开始考试</button></div>";
  if(n === 0){ h += '<div class="bank-note">当前无可用题库：请到「题库管理」导入题库，或勾选已有题库。</div>'; }
  h += "</div>";
  document.getElementById("exam-box").innerHTML = h;
  updateBankName();

  document.querySelectorAll("#exam-box .bank-check input").forEach(function(cb){
    cb.addEventListener("change", function(){
      var id = cb.getAttribute("data-bank-id");
      var idx = state.selectedBankIds.indexOf(id);
      if(cb.checked && idx < 0) state.selectedBankIds.push(id);
      if(!cb.checked && idx >= 0) state.selectedBankIds.splice(idx, 1);
      saveSelectedBanks();
      renderExamSetup();
    });
  });
  var count = document.getElementById("exam-count");
  if(count){
    count.addEventListener("change", function(){
      var v = parseInt(count.value, 10);
      if(isNaN(v) || v < 1) v = 1;
      var bk = selectedBanks();
      var total = bk.reduce(function(s, b){ return s + b.questions.length; }, 0);
      if(v > total) v = Math.max(1, total);
      count.value = v;
      state.settings.examCount = v;
      saveSettings();
    });
  }
  var sq = document.getElementById("opt-shuffle-q");
  if(sq) sq.addEventListener("change", function(){ state.settings.shuffleQ = sq.checked; saveSettings(); });
  var so = document.getElementById("opt-shuffle-o");
  if(so) so.addEventListener("change", function(){ state.settings.shuffleOpt = so.checked; saveSettings(); });
  var start = document.getElementById("btn-start-exam");
  if(start) start.addEventListener("click", startExam);
}

function startExam(){
  var banks = selectedBanks();
  if(!banks.length){ toast("请至少勾选一个包含题目的题库"); return; }
  state.exam = buildExam();
  state.examStage = "running";
  renderExamRunning();
}

function examAnsweredCount(){
  return state.exam.answers.filter(function(a){ return a.length > 0; }).length;
}

function renderExamRunning(){
  var e = state.exam;
  var N = e.questions.length;
  var idx = e.idx;
  var q = e.questions[idx];
  var sel = e.answers[idx];
  var answered = examAnsweredCount();
  var h = "";
  h += '<div class="card">';
  h += '<div class="exam-head"><span class="exam-count">第 <b>' + (idx + 1) + '</b> / ' + N + " 题</span>";
  h += '<div class="progress"><i style="width:' + Math.round((idx + 1) / N * 100) + '%"></i></div>';
  h += typeBadge(q.type) + "</div>";
  h += '<div class="q-body"><div class="q-text">' + esc(q.text) + "</div>";
  h += '<div class="q-tip">' + (q.type === "multiple" ? "多选题：可多选，须与正确答案完全一致才得分" : "点击选择答案") + "</div>";
  q.options.forEach(function(opt, i){
    var cls = sel.indexOf(i) >= 0 ? " selected" : "";
    h += '<button class="opt' + cls + '" data-i="' + i + '"><span class="opt-key">' + letter(i) + "</span><span>" + esc(opt) + "</span></button>";
  });
  h += '<div class="palette">';
  for(var i = 0; i < N; i++){
    var cls = i === idx ? " cur" : (e.answers[i].length > 0 ? " done" : "");
    h += '<button class="p-num' + cls + '" data-i="' + i + '">' + (i + 1) + "</button>";
  }
  h += "</div><div class='palette-tip'>已作答 " + answered + " / " + N + " 题，点击题号可跳转</div>";
  h += '<div class="exam-foot"><button class="btn btn-ghost" id="btn-prev"' + (idx === 0 ? " disabled" : "") + ">上一题</button>";
  h += '<button class="btn btn-ghost" id="btn-next"' + (idx === N - 1 ? " disabled" : "") + ">下一题</button>";
  h += '<span class="spacer"></span><button class="btn btn-danger" id="btn-submit">交卷</button></div>';
  h += "</div></div>";
  document.getElementById("exam-box").innerHTML = h;

  document.querySelectorAll("#exam-box .opt").forEach(function(btn){
    btn.addEventListener("click", function(){
      var i = parseInt(btn.getAttribute("data-i"), 10);
      if(q.type === "multiple"){
        var p = sel.indexOf(i);
        if(p >= 0){ sel.splice(p, 1); } else { sel.push(i); }
      } else {
        state.exam.answers[idx] = [i];
      }
      renderExamRunning();
    });
  });
  document.querySelectorAll("#exam-box .p-num").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.exam.idx = parseInt(btn.getAttribute("data-i"), 10);
      renderExamRunning();
    });
  });
  var prev = document.getElementById("btn-prev");
  if(prev) prev.addEventListener("click", function(){ state.exam.idx--; renderExamRunning(); });
  var next = document.getElementById("btn-next");
  if(next) next.addEventListener("click", function(){ state.exam.idx++; renderExamRunning(); });
  var sub = document.getElementById("btn-submit");
  if(sub) sub.addEventListener("click", submitExam);
}

function submitExam(){
  var e = state.exam;
  var left = e.questions.length - examAnsweredCount();
  if(left > 0){
    if(!window.confirm("还有 " + left + " 题未作答，确定要交卷吗？")) return;
  }
  var correct = 0;
  e.questions.forEach(function(q, i){ if(isCorrect(q, e.answers[i])) correct++; });
  var score = Math.round(correct / e.questions.length * 1000) / 10;
  var pass = score >= PASS_LINE;
  var att = {
    t: Date.now(),
    score: score,
    correct: correct,
    total: e.questions.length,
    pass: pass,
    bankId: e.bankIds && e.bankIds.length ? e.bankIds[0] : (e.bankId || ""),
    bankIds: e.bankIds || (e.bankId ? [e.bankId] : []),
    bankTitle: e.bankTitle || "",
    qids: e.questions.map(function(q){ return q.id; }),
    answers: e.questions.map(function(q, i){
      var a = e.answers[i] || [];
      if(q.om) a = a.map(function(x){ return q.om[x]; });
      return a.slice();
    })
  };
  state.history.unshift(att);
  if(state.history.length > 200) state.history.length = 200;
  saveHistory();
  state.examStage = "result";
  state.lastAtt = att;
  renderResult(att, e.questions, e.answers);
}

/* 渲染成绩结果；questions/answers 可选，供历史记录回看时按题库映射 */
function renderResult(att, questions, answers){
  var qs = questions || [];
  var as = answers || [];
  if(!questions){
    /* 组卷记录：按 bankIds 匹配多个题库；无 bankIds 时回退 bankId / 命中率匹配 */
    var banks = [];
    var ids = att.bankIds || (att.bankId ? [att.bankId] : []);
    ids.forEach(function(id){ var b = getBankById(id); if(b) banks.push(b); });
    if(!banks.length){
      /* 旧版记录没有 bankId：按题目 id 命中数在现有题库里找最匹配的 */
      var best = null, bestHit = -1;
      state.banks.forEach(function(b){
        var hit = 0;
        att.qids.forEach(function(id){
          for(var j = 0; j < b.questions.length; j++){ if(b.questions[j].id === id){ hit++; break; } }
        });
        if(hit > bestHit){ bestHit = hit; best = b; }
      });
      if(best) banks.push(best);
    }
    if(!banks.length){
      document.getElementById("exam-box").innerHTML =
        '<div class="card"><div class="p-empty">原题库「' + esc(att.bankTitle || "未知题库") + "」已被删除，无法回看本次答题详情。</div>" +
        '<div class="btn-row" style="justify-content:center;margin-top:6px"><button class="btn btn-ghost btn-lg" id="btn-exam-home2">返回考试设置</button></div></div>';
      var h2 = document.getElementById("btn-exam-home2");
      if(h2) h2.addEventListener("click", function(){ state.exam = null; state.examStage = "setup"; renderExamStage(); });
      return;
    }
    att.qids.forEach(function(id, i){
      var found = null;
      for(var bi = 0; bi < banks.length && !found; bi++){
        for(var j = 0; j < banks[bi].questions.length; j++){
          if(banks[bi].questions[j].id === id){ found = banks[bi].questions[j]; break; }
        }
      }
      if(found){ qs.push(found); as.push(att.answers[i] || []); }
      else { qs.push({ id: id, type: "single", text: "（该题已不在题库中，无法回看）", options: [], answer: [], explain: "" }); as.push([]); }
    });
  }
  var C = 2 * Math.PI * 52;
  var offset = C * (1 - Math.min(100, Math.max(0, att.score)) / 100);
  var cls = att.pass ? "pass" : "fail";
  var h = "";
  h += '<div class="card">';
  h += '<div class="result-top">';
  h += '<div class="donut-wrap"><svg viewBox="0 0 120 120"><circle class="donut-bg" cx="60" cy="60" r="52"></circle><circle class="donut-fg ' + cls + '" cx="60" cy="60" r="52" style="stroke-dasharray:' + C.toFixed(2) + ";stroke-dashoffset:" + offset.toFixed(2) + '"></circle></svg>';
  h += '<div class="donut-num"><b style="color:' + (att.pass ? "var(--ok)" : "var(--bad)") + '">' + fmtScore(att.score) + '</b><span>分 · 满分 100</span></div></div>';
  h += '<div class="result-info">';
  var rk = scoreRank(att.score);
  h += '<h3 class="' + cls + '">' + (att.pass ? "恭喜通过！" : "未通过") + "</h3>";
  h += '<div class="sub">本次得分 ' + fmtScore(att.score) + " 分，及格线 " + PASS_LINE + " 分。" + (att.pass ? "已达到及格要求。" : "未达到及格线，需要重新答题。") + ' 评价：<span class="rank-badge rank-' + rk.cls + '">' + rk.name + "</span></div>";
  h += '<div class="stat-grid"><div class="stat-cell"><b>' + att.correct + '</b><span>答对题数</span></div>';
  h += '<div class="stat-cell"><b>' + (att.total - att.correct) + '</b><span>答错题数</span></div>';
  h += '<div class="stat-cell"><b>' + att.total + '</b><span>总题数</span></div>';
  h += '<div class="stat-cell"><b>' + rk.name + '</b><span>评价</span></div></div>';
  if(att.bankTitle) h += '<div class="bank-note">题库：' + esc(att.bankTitle) + "</div>";
  h += "</div></div>";
  h += '<div class="result-actions btn-row">';
  h += '<button class="btn btn-primary btn-lg" id="btn-retake">' + (att.pass ? "再考一次" : "重新答题") + "</button>";
  h += '<button class="btn btn-ghost btn-lg" id="btn-exam-home">返回考试设置</button></div>';
  h += "</div>";

  if(qs.length > 0){
    /* 答题详情：答错的题优先排在前面，便于核对；保留原始题号 */
    var items = qs.map(function(q, i){ return { q: q, a: as[i] || [], no: i + 1, right: isCorrect(q, as[i]) }; });
    items.sort(function(x, y){ return (x.right ? 1 : 0) - (y.right ? 1 : 0); });
    h += '<div class="card"><div class="view-title" style="margin-bottom:4px"><h2>答题详情</h2><span class="muted">答错的题已排在前 · 红为答错，绿为答对</span></div>';
    items.forEach(function(it){
      var q = it.q, right = it.right;
      var showOpts = q.options.length > 0;
      h += '<div class="review-item">' + typeBadge(q.type);
      h += '<div class="review-q">' + it.no + ". " + esc(q.text) + "</div>";
      if(showOpts){
        h += '<div class="review-row"><span class="tag">你的答案</span><span class="val ' + (right ? "right" : "miss") + '">' + (it.a.length ? it.a.map(function(x){ return letter(x) + ". " + esc(q.options[x]); }).join("；") : "未作答") + "</span></div>";
        h += '<div class="review-row"><span class="tag">正确答案</span><span class="val">' + q.answer.map(function(x){ return letter(x) + ". " + esc(q.options[x]); }).join("；") + "</span></div>";
      }
      if(q.explain){ h += '<div class="review-explain"><b>解析：</b>' + esc(q.explain) + "</div>"; }
      h += "</div>";
    });
    h += "</div>";

}

/* =====================================================================
 * 视图：刷题练习（按所选题库）
 * ===================================================================== */
function practiceKey(bank, qid){ return bank.id + ":" + qid; }

function practiceStatsHTML(){
  var bank = currentBank();
  var attempts = 0, right = 0, done = 0;
  if(bank){
    var prefix = bank.id + ":";
    Object.keys(state.practice).forEach(function(k){
      if(k.indexOf(prefix) === 0){
        attempts += state.practice[k].t;
        right += state.practice[k].r;
        done++;
      }
    });
  }
  var rate = attempts ? Math.round(right / attempts * 100) : 0;
  return '<span>已练题目 <b>' + done + '</b> 道</span><span>累计作答 <b>' + attempts + '</b> 次</span><span>正确率 <b>' + rate + '%</b></span>';
}
function refreshPracticeStats(){
  var el = document.getElementById("practice-stats");
  if(el) el.innerHTML = practiceStatsHTML();
}

function practiceCardHTML(q, i){
  var bank = currentBank();
  var p = state.practice[practiceKey(bank, q.id)] || { t: 0, r: 0 };
  var h = '<div class="p-card">';
  h += '<div class="p-card-head">' + typeBadge(q.type) + '<span class="p-num-tag">第 ' + (i + 1) + " 题 · 已练 " + p.t + " 次</span></div>";
  h += '<div class="q-text">' + esc(q.text) + "</div>";
  q.options.forEach(function(opt, x){
    h += '<button class="opt" data-oi="' + x + '"><span class="opt-key">' + letter(x) + "</span><span>" + esc(opt) + "</span></button>";
  });
  if(q.type === "multiple"){
    h += '<div class="btn-row" style="margin-top:6px"><button class="btn btn-ghost" data-check="1">检查答案</button></div>';
  }
  h += '<div class="p-feedback" hidden></div></div>';
  return h;
}

function renderPracticeBox(){
  var bank = currentBank();
  var qs = bank ? bank.questions : [];
  var f = state.practiceFilter;
  var kw = state.practiceKeyword.trim().toLowerCase();
  var list = qs.filter(function(q){
    if(f !== "all" && q.type !== f) return false;
    if(kw){
      var hay = (q.text + " " + q.options.join(" ")).toLowerCase();
      if(hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
  var counts = { all: qs.length, single: 0, multiple: 0, judge: 0 };
  qs.forEach(function(q){ counts[q.type]++; });
  var h = "";
  h += '<div class="filter-row">';
  h += bankSelectHTML("practice-bank-select");
  ["all","single","multiple","judge"].forEach(function(t){
    h += '<button class="chip' + (f === t ? " active" : "") + '" data-f="' + t + '">' + (t === "all" ? "全部" : typeName(t)) + " (" + counts[t] + ")</button>";
  });
  h += '<div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="practice-search" type="text" placeholder="搜索题干或选项关键词" value="' + esc(state.practiceKeyword) + '"></div></div>';
  h += '<div class="p-stat" id="practice-stats">' + practiceStatsHTML() + "</div>";
  if(!bank || qs.length === 0){
    h += '<div class="card"><div class="p-empty">当前题库为空，请到「题库管理」导入题库</div></div>';
  } else if(list.length === 0){
    h += '<div class="card"><div class="p-empty">没有符合条件的题目</div></div>';
  } else {
    var pageSize = 40;
    var pages = Math.max(1, Math.ceil(list.length / pageSize));
    if(state.practicePage >= pages) state.practicePage = pages - 1;
    if(state.practicePage < 0) state.practicePage = 0;
    var start = state.practicePage * pageSize;
    var pageQs = list.slice(start, start + pageSize);
    pageQs.forEach(function(q, j){ h += practiceCardHTML(q, start + j); });
    h += '<div class="pager"><button class="btn btn-ghost" id="practice-prev"' + (state.practicePage <= 0 ? " disabled" : "") + '>上一页</button>';
    h += '<span class="pager-info">第 ' + (state.practicePage + 1) + " / " + pages + " 页 · 共 " + list.length + " 题 · 每页 " + pageSize + " 题</span>";
    h += '<button class="btn btn-ghost" id="practice-next"' + (state.practicePage >= pages - 1 ? " disabled" : "") + '>下一页</button></div>';
    state.practicePages = pages;
  }
  document.getElementById("practice-box").innerHTML = h;

  var bankSel = document.getElementById("practice-bank-select");
  if(bankSel) bankSel.addEventListener("change", function(){
    state.selectedBankId = bankSel.value;
    state.settings.defaultBankId = state.selectedBankId;
    saveSettings();
    state.practicePage = 0;
    renderPracticeBox();
  });
  document.querySelectorAll("#practice-box .chip").forEach(function(b){
    b.addEventListener("click", function(){ state.practiceFilter = b.getAttribute("data-f"); state.practicePage = 0; renderPracticeBox(); });
  });
  var s = document.getElementById("practice-search");
  if(s) s.addEventListener("input", function(){
    state.practiceKeyword = s.value;
    state.practicePage = 0;
    renderPracticeBox();
    var ns = document.getElementById("practice-search");
    if(ns){ ns.focus(); ns.setSelectionRange(ns.value.length, ns.value.length); }
  });
  var prevBtn = document.getElementById("practice-prev");
  if(prevBtn) prevBtn.addEventListener("click", function(){
    if(state.practicePage > 0){ state.practicePage--; renderPracticeBox(); window.scrollTo(0, 0); }
  });
  var nextBtn = document.getElementById("practice-next");
  if(nextBtn) nextBtn.addEventListener("click", function(){
    var pages = state.practicePages || 1;
    if(state.practicePage < pages - 1){ state.practicePage++; renderPracticeBox(); window.scrollTo(0, 0); }
  });
  pageQs.forEach(function(q, j){ bindPracticeCard(bank, q, j); });
}

function bindPracticeCard(bank, q, idx){
  var card = document.querySelectorAll("#practice-box .p-card")[idx];
  if(!card) return;
  var opts = card.querySelectorAll(".opt");
  var checkBtn = card.querySelector('[data-check="1"]');
  var fb = card.querySelector(".p-feedback");
  var sel = [];
  function finish(right){
    opts.forEach(function(b){ b.disabled = true; });
    if(checkBtn) checkBtn.disabled = true;
    fb.hidden = false;
    fb.className = "p-feedback " + (right ? "right" : "wrong");
    var mine = q.type === "multiple" ? sel.slice().sort(function(a,b){ return a - b; }) : (sel.length ? [sel[0]] : []);
    var html = "<b>" + (right ? "回答正确" : "回答错误") + "</b>";
    if(!right){
      html += "，正确答案：" + q.answer.map(function(x){ return letter(x) + ". " + esc(q.options[x]); }).join("；");
      if(mine.length) html += "<br>你的答案：" + mine.map(function(x){ return letter(x) + ". " + esc(q.options[x]); }).join("；");
    }
    if(q.explain) html += "<br><b>解析：</b>" + esc(q.explain);
    fb.innerHTML = html;
    var key = practiceKey(bank, q.id);
    var rec = state.practice[key] || { t: 0, r: 0 };
    rec.t++; if(right) rec.r++;
    state.practice[key] = rec;
    savePractice();
    refreshPracticeStats();
  }
  opts.forEach(function(b){
    b.addEventListener("click", function(){
      var x = parseInt(b.getAttribute("data-oi"), 10);
      if(q.type === "multiple"){
        var p = sel.indexOf(x);
        if(p >= 0){ sel.splice(p, 1); b.classList.remove("selected"); }
        else { sel.push(x); b.classList.add("selected"); }
      } else {
        sel = [x];
        var right = isCorrect(q, sel);
        b.classList.add(right ? "correct" : "wrong");
        opts.forEach(function(o){ if(o !== b && right === false && q.answer.indexOf(parseInt(o.getAttribute("data-oi"), 10)) >= 0) o.classList.add("correct"); });
        finish(right);
      }
    });
  });
  if(checkBtn) checkBtn.addEventListener("click", function(){
    if(!sel.length){ toast("请先选择答案"); return; }
    var right = isCorrect(q, sel);
    opts.forEach(function(b){
      var x = parseInt(b.getAttribute("data-oi"), 10);
      if(q.answer.indexOf(x) >= 0) b.classList.add("correct");
      else if(sel.indexOf(x) >= 0) b.classList.add("wrong");
    });
    finish(right);
  });
}

/* =====================================================================
 * 视图：题库管理（密码锁 + 多题库）
 * ===================================================================== */
function validateBank(obj){
  if(!obj || typeof obj !== "object") return { ok:false, err:"不是有效的 JSON 对象" };
  var qs = Array.isArray(obj) ? obj : obj.questions;
  if(!Array.isArray(qs)) return { ok:false, err:"缺少 questions 数组，请检查 JSON 结构" };
  if(qs.length === 0) return { ok:false, err:"题库为空（questions 数组没有任何题目）" };
  var out = [], errs = [], seen = {};
  qs.forEach(function(q, i){
    var no = i + 1;
    if(!q || typeof q !== "object"){ errs.push("第 " + no + " 题：不是对象"); return; }
    if(["single","multiple","judge"].indexOf(q.type) < 0){ errs.push("第 " + no + " 题：type 必须是 single / multiple / judge"); return; }
    if(typeof q.text !== "string" || !q.text.trim()){ errs.push("第 " + no + " 题：缺少题干 text"); return; }
    if(!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 10){ errs.push("第 " + no + " 题：options 需为 2~10 个选项的数组"); return; }
    if(!Array.isArray(q.answer) || q.answer.length === 0){ errs.push("第 " + no + " 题：缺少 answer 下标数组"); return; }
    var bad = q.answer.some(function(a){ return !Number.isInteger(a) || a < 0 || a >= q.options.length; });
    if(bad){ errs.push("第 " + no + " 题：answer 下标越界（应从 0 开始）"); return; }
    if(q.type !== "multiple" && q.answer.length !== 1){ errs.push("第 " + no + " 题：单选/判断题只能有 1 个正确答案"); return; }
    var id = (typeof q.id === "string" && q.id) ? q.id : uid();
    if(seen[id]) id = uid();
    seen[id] = true;
    out.push({ id: id, type: q.type, text: String(q.text).trim(), options: q.options.map(String), answer: q.answer.slice(), explain: typeof q.explain === "string" ? q.explain : "" });
  });
  if(errs.length) return { ok:false, err:"导入失败：" + errs.slice(0, 3).join("；") + (errs.length > 3 ? "，等共 " + errs.length + " 处问题" : "") };
  return { ok:true, title: (typeof obj.title === "string" && obj.title) ? obj.title : "我的题库", questions: out };
}

function importBankAsNew(text){
  var msg = document.getElementById("import-msg");
  var obj;
  try { obj = JSON.parse(text); }
  catch(e){ if(msg){ msg.className = "import-msg err"; msg.textContent = "JSON 解析失败：" + e.message; } return; }
  var v = validateBank(obj);
  if(!v.ok){ if(msg){ msg.className = "import-msg err"; msg.textContent = v.err; } return; }
  var nb = { id: uid(), title: v.title, questions: v.questions };
  state.banks.push(nb);
  if(state.banks.length === 1 || !currentBank()) state.selectedBankId = nb.id;
  saveBanks();
  toast("已新增题库「" + v.title + "」，共 " + v.questions.length + " 题");
  renderBankPanel();
  renderExamSetup();
  if(!document.getElementById("view-practice").hidden) renderPracticeBox();
}

/* 合并进当前题库：题干完全相同的题目不覆盖，只追加新题目 */
function importBankMerge(text){
  var msg = document.getElementById("import-msg");
  var target = currentBank();
  if(!target){
    if(msg){ msg.className = "import-msg err"; msg.textContent = "当前没有题库可合并：请先在题库列表「设为当前」，或直接导入为新题库。"; }
    return;
  }
  var obj;
  try { obj = JSON.parse(text); }
  catch(e){ if(msg){ msg.className = "import-msg err"; msg.textContent = "JSON 解析失败：" + e.message; } return; }
  var v = validateBank(obj);
  if(!v.ok){ if(msg){ msg.className = "import-msg err"; msg.textContent = v.err; } return; }
  var seen = {};
  target.questions.forEach(function(q){ seen[q.text] = true; });
  var added = 0, dup = 0;
  v.questions.forEach(function(q){
    if(seen[q.text]){ dup++; return; }
    seen[q.text] = true;
    target.questions.push(q);
    added++;
  });
  if(added){
    saveBanks();
    toast("已合并进「" + target.title + "」：新增 " + added + " 题，跳过重复 " + dup + " 题");
  } else {
    toast("没有新题：全部 " + dup + " 题与当前题库重复");
  }
  renderBankPanel();
  renderExamSetup();
  if(!document.getElementById("view-practice").hidden) renderPracticeBox();
}

function exportBank(bank){
  var data = JSON.stringify(bank, null, 2);
  var blob = new Blob([data], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (bank.title || "题库") + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast("已导出「" + bank.title + "」为 JSON 文件");
}
