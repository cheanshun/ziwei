/* 编辑器过滤已并入 renderBankEditor（按数组过滤 + 分页），此函数不再使用 */
function applyBankEditFilter(){ renderBankEditor(); }

/* 从 DOM 回读当前可见页的编辑内容到题库数组（按 data-qi 定位，不重建数组） */
function syncBankEditorFromDOM(){
  var bank = getBankById(state.bankEditId);
  if(!bank) return;
  var cards = document.querySelectorAll("#bank-box .edit-q-card");
  cards.forEach(function(card){
    var qi = parseInt(card.getAttribute("data-qi"), 10);
    if(isNaN(qi) || qi < 0 || qi >= bank.questions.length) return;
    var old = bank.questions[qi] || {};
    var type = card.querySelector('[data-f="type"]').value;
    var text = card.querySelector('[data-f="text"]').value;
    var explain = card.querySelector('[data-f="explain"]').value;
    var optRows = card.querySelectorAll(".edit-opt-row");
    var opts = [], ans = [];
    optRows.forEach(function(row, oi){
      opts.push(row.querySelector('[data-f="opt"]').value);
      if(row.querySelector('[data-f="ans"]').checked) ans.push(oi);
    });
    bank.questions[qi] = { id: old.id, type: type, text: text, options: opts, answer: ans, explain: explain };
  });
}

function bankEditClick(ev){
  var t = ev.target;
  var box = document.getElementById("bank-box");
  if(!box.contains(t)) return;
  var delq = t.getAttribute("data-delq");
  if(delq !== null){
    if(!window.confirm("确定删除本题吗？此操作不可撤销。")) return;
    var bank = getBankById(state.bankEditId);
    if(!bank) return;
    syncBankEditorFromDOM();
    bank.questions.splice(parseInt(delq, 10), 1);
    if(!bank.questions.length) bank.questions.push({ id: uid(), type: "single", text: "", options: ["", ""], answer: [0], explain: "" });
    renderBankEditor();
    return;
  }
  var delopt = t.getAttribute("data-delopt");
  if(delopt !== null){
    var row = t.closest(".edit-opt-row");
    if(row) row.remove();
    return;
  }
  var addopt = t.getAttribute("data-addopt");
  if(addopt !== null){
    var qi = parseInt(addopt, 10);
    var card = document.querySelector('#bank-box .edit-q-card[data-qi="' + qi + '"]');
    if(!card) return;
    var q = getBankById(state.bankEditId).questions[qi];
    var isMulti = q && q.type === "multiple";
    var row = document.createElement("div");
    row.className = "edit-opt-row";
    row.innerHTML = '<input type="' + (isMulti ? "checkbox" : "radio") + '" name="e-ans-' + qi + '" data-f="ans">' +
                    '<input class="text-input" data-f="opt" value="">' +
                    '<button class="btn btn-ghost" data-delopt="' + qi + '">删</button>';
    var addBtn = t.closest(".btn-row");
    if(addBtn && addBtn.parentNode) addBtn.parentNode.insertBefore(row, addBtn);
    return;
  }
}

function bankEditChange(ev){
  var t = ev.target;
  var box = document.getElementById("bank-box");
  if(!box.contains(t)) return;
  if(t.getAttribute("data-f") === "type"){
    syncBankEditorFromDOM();
    renderBankEditor();
  }
}

function saveBankEditor(){
  var bank = getBankById(state.bankEditId);
  if(!bank) return;
  syncBankEditorFromDOM();
  var qsAll = bank.questions;
  if(!qsAll.length){ toast("题库为空，无法保存"); return; }
  var qs = [];
  var err = null;
  qsAll.forEach(function(q, ci){
    if(err) return;
    var type = q.type;
    var text = (q.text || "").trim();
    var explain = (q.explain || "").trim();
    var opts = (q.options || []).map(function(o){ return (o || "").trim(); });
    var ans = q.answer || [];
    for(var oi = 0; oi < opts.length; oi++){
      if(!opts[oi]){ err = "第 " + (ci + 1) + " 题：选项 " + letter(oi) + " 不能为空"; return; }
    }
    if(["single","multiple","judge"].indexOf(type) < 0){ err = "第 " + (ci + 1) + " 题：题型无效"; return; }
    if(!text){ err = "第 " + (ci + 1) + " 题：题干不能为空"; return; }
    if(opts.length < 2 || opts.length > 10){ err = "第 " + (ci + 1) + " 题：选项需为 2~10 个"; return; }
    var seen = {};
    for(var j = 0; j < opts.length; j++){
      if(seen[opts[j]]){ err = "第 " + (ci + 1) + " 题：存在重复选项"; return; }
      seen[opts[j]] = true;
    }
    if(!ans.length){ err = "第 " + (ci + 1) + " 题：请勾选正确答案"; return; }
    if(type !== "multiple" && ans.length !== 1){ err = "第 " + (ci + 1) + " 题：单选/判断题只能勾选 1 个答案"; return; }
    qs.push({ id: q.id || uid(), type: type, text: text, options: opts, answer: ans.slice().sort(function(a,b){ return a - b; }), explain: explain });
  });
  if(err){ toast(err); return; }
  bank.questions = qs;
  saveBanks();
  toast("题库「" + bank.title + "」已保存，共 " + qs.length + " 题");
  state.bankEditId = null;
  renderBankPanel();
  renderExamSetup();
  if(!document.getElementById("view-practice").hidden) renderPracticeBox();
}

/* =====================================================================
 * 视图：考试闯关（七级 · 不可跳级 · 60 分通关）
 * ===================================================================== */
function levelBest(i){ return state.level.best && typeof state.level.best[i] === "number" ? state.level.best[i] : null; }
function levelDone(i){ var b = levelBest(i); return b !== null && b >= PASS_LINE; }
function levelUnlocked(i){
  if(i === 0) return true;
  return levelDone(i - 1);
}
function levelDoneCount(){
  var n = 0;
  for(var i = 0; i < LEVELS.length; i++){ if(levelDone(i)) n++; }
  return n;
}
function currentLevelIndex(){
  for(var i = LEVELS.length - 1; i >= 0; i--){ if(levelDone(i)) return i; }
  return -1;
}

function buildLevelExam(lvl){
  var bank = currentBank();
  if(!bank || !bank.questions.length) return null;
  var cfg = LEVELS[lvl];
  var src = bank.questions.slice();
  if(state.settings.shuffleQ) shuffle(src);
  var multis = src.filter(function(q){ return q.type === "multiple"; });
  var others = src.filter(function(q){ return q.type !== "multiple"; });
  shuffle(multis);
  shuffle(others);
  var picked = [];
  for(var m = 0; m < cfg.multi && multis.length; m++) picked.push(multis.pop());
  var need = cfg.count - picked.length;
  for(var o = 0; o < need && others.length; o++) picked.push(others.pop());
  if(picked.length === 0) return null;
  if(state.settings.shuffleOpt){
    picked = picked.map(function(q){
      var items = q.options.map(function(text, i){ return { text: text, i: i }; });
      shuffle(items);
      var opts = [], map = {}, om = [];
      items.forEach(function(it, ni){ map[it.i] = ni; om[ni] = it.i; opts.push(it.text); });
      return { id: q.id, type: q.type, text: q.text, options: opts, answer: q.answer.map(function(i){ return map[i]; }).sort(function(a,b){ return a - b; }), om: om, explain: q.explain || "" };
    });
  }
  return { lvl: lvl, bankId: bank.id, bankTitle: bank.title, questions: picked, answers: picked.map(function(){ return []; }), idx: 0 };
}

function renderLevelBox(){
  if(state.levelStage === "running" && state.levelExam) renderLevelRunning();
  else if(state.levelStage === "pass") renderLevelResult(true);
  else if(state.levelStage === "fail") renderLevelResult(false);
  else renderLevelMap();
}

function renderLevelMap(){
  var bank = currentBank();
  var n = bank ? bank.questions.length : 0;
  var doneCount = levelDoneCount();
  var cur = currentLevelIndex();
  var h = "";
  h += '<div class="card">';
  h += '<div class="level-head"><div class="level-progress-num">闯关进度 ' + doneCount + ' / ' + LEVELS.length + '</div>';
  h += '<div class="level-progress"><i style="width:' + (doneCount / LEVELS.length * 100) + '%"></i></div></div>';
  h += '<div class="setting-row"><div><div class="setting-label">选择题库</div><div class="setting-desc">闯关抽题自题库随机抽取，难度按级别递增</div></div>';
  h += '<div class="setting-ctl">' + bankSelectHTML("level-bank-select") + '</div></div>';
  if(n === 0){ h += '<div class="bank-note">当前题库为空：请到「题库管理」导入题库，或在下方切换其他题库。</div>'; }
  h += '</div>';
  h += '<div class="card"><div class="lvl-grid">';
  LEVELS.forEach(function(cfg, i){
    var unlocked = levelUnlocked(i);
    var done = levelDone(i);
    var best = levelBest(i);
    var isCur = unlocked && !done && i === cur + 1;
    h += '<div class="lvl-card' + (unlocked ? "" : " locked") + (isCur ? " current" : "") + '" data-lvl="' + i + '">';
    h += '<div class="lvl-icon lvl-c' + i + '">';
    h += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M4 20V8l6 4V8l6 4V4l4 2v14"/></svg>';
    h += '</div>';
    h += '<div class="lvl-name">' + cfg.name + '</div>';
    h += '<div class="lvl-title">' + cfg.title + '</div>';
    h += '<div class="lvl-meta">' + cfg.count + ' 题 · ' + cfg.ratio + '</div>';
    if(best !== null) h += '<div class="lvl-best">历史最佳 ' + fmtScore(best) + ' 分</div>';
    h += '<div><span class="lvl-status ' + (done ? "done" : (unlocked ? "todo" : "locked")) + '">' + (done ? "已通关" : (unlocked ? (isCur ? "可挑战" : "可挑战") : "未解锁")) + '</span></div>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="lvl-note">规则：闯关不能跳级，只能一级一级闯。每关 60 分及格，通关后进入下一级；不及格需重新挑战本关。</div>';
  h += '</div>';
  document.getElementById("level-box").innerHTML = h;

  var bankSel = document.getElementById("level-bank-select");
  if(bankSel) bankSel.addEventListener("change", function(){
    state.selectedBankId = bankSel.value;
    state.settings.defaultBankId = state.selectedBankId;
    saveSettings();
    renderLevelMap();
  });
  document.querySelectorAll("#level-box .lvl-card:not(.locked)").forEach(function(card){
    card.addEventListener("click", function(){
      var i = parseInt(card.getAttribute("data-lvl"), 10);
      startLevel(i);
    });
  });
}

function startLevel(i){
  if(!levelUnlocked(i)){ toast("请先通关上一级别"); return; }
  var bank = currentBank();
  if(!bank || !bank.questions.length){ toast("当前题库为空，请先导入题库"); return; }
  state.levelExam = buildLevelExam(i);
  if(!state.levelExam){ toast("题库题目不足，无法生成闯关试卷"); return; }
  state.levelStage = "running";
  renderLevelRunning();
}

function renderLevelRunning(){
  var e = state.levelExam;
  var N = e.questions.length;
  var idx = e.idx;
  var q = e.questions[idx];
  var sel = e.answers[idx];
  var answered = e.answers.filter(function(a){ return a.length > 0; }).length;
  var cfg = LEVELS[e.lvl];
  var h = "";
  h += '<div class="card">';
  h += '<div class="exam-head"><span class="exam-count"><b>' + cfg.name + '</b> · 第 ' + (idx + 1) + ' / ' + N + ' 题</span>';
  h += '<div class="progress"><i style="width:' + Math.round((idx + 1) / N * 100) + '%"></i></div>';
  h += typeBadge(q.type) + '</div>';
  h += '<div class="q-body"><div class="q-text">' + esc(q.text) + '</div>';
  h += '<div class="q-tip">' + (q.type === "multiple" ? "多选题：可多选，须与正确答案完全一致才得分" : "点击选择答案") + '</div>';
  q.options.forEach(function(opt, i){
    var cls = sel.indexOf(i) >= 0 ? " selected" : "";
    h += '<button class="opt' + cls + '" data-i="' + i + '"><span class="opt-key">' + letter(i) + '</span><span>' + esc(opt) + '</span></button>';
  });
  h += '<div class="palette">';
  for(var i = 0; i < N; i++){
    var cls = i === idx ? " cur" : (e.answers[i].length > 0 ? " done" : "");
    h += '<button class="p-num' + cls + '" data-i="' + i + '">' + (i + 1) + '</button>';
  }
  h += '</div><div class="palette-tip">已作答 ' + answered + ' / ' + N + ' 题，点击题号可跳转</div>';
  h += '<div class="exam-foot"><button class="btn btn-ghost" id="btn-lv-prev"' + (idx === 0 ? " disabled" : "") + '>上一题</button>';
  h += '<button class="btn btn-ghost" id="btn-lv-next"' + (idx === N - 1 ? " disabled" : "") + '>下一题</button>';
  h += '<span class="spacer"></span><button class="btn btn-danger" id="btn-lv-submit">交卷闯关</button></div>';
  h += '</div></div>';
  document.getElementById("level-box").innerHTML = h;

  document.querySelectorAll("#level-box .opt").forEach(function(btn){
    btn.addEventListener("click", function(){
      var i = parseInt(btn.getAttribute("data-i"), 10);
      if(q.type === "multiple"){
        var p = sel.indexOf(i);
        if(p >= 0){ sel.splice(p, 1); } else { sel.push(i); }
      } else {
        e.answers[idx] = [i];
      }
      renderLevelRunning();
    });
  });
  document.querySelectorAll("#level-box .p-num").forEach(function(btn){
    btn.addEventListener("click", function(){
      e.idx = parseInt(btn.getAttribute("data-i"), 10);
      renderLevelRunning();
    });
  });
  var prev = document.getElementById("btn-lv-prev");
  if(prev) prev.addEventListener("click", function(){ e.idx--; renderLevelRunning(); });
  var next = document.getElementById("btn-lv-next");
  if(next) next.addEventListener("click", function(){ e.idx++; renderLevelRunning(); });
  var sub = document.getElementById("btn-lv-submit");
  if(sub) sub.addEventListener("click", submitLevelExam);
}

function submitLevelExam(){
  var e = state.levelExam;
  var left = e.questions.length - e.answers.filter(function(a){ return a.length > 0; }).length;
  if(left > 0){
    if(!window.confirm("还有 " + left + " 题未作答，确定要交卷吗？")) return;
  }
  var correct = 0;
  e.questions.forEach(function(q, i){ if(isCorrect(q, e.answers[i])) correct++; });
  var score = Math.round(correct / e.questions.length * 1000) / 10;
  var pass = score >= PASS_LINE;
  if(pass){
    var old = levelBest(e.lvl);
    if(old === null || score > old){
      state.level.best = state.level.best || {};
      state.level.best[e.lvl] = score;
      saveLevel();
    }
  }
  var att = {
    t: Date.now(), score: score, correct: correct, total: e.questions.length, pass: pass,
    bankId: e.bankId, bankIds: e.bankId ? [e.bankId] : [], bankTitle: e.bankTitle || "", mode: "level", level: e.lvl,
    levelName: LEVELS[e.lvl].name,
    qids: e.questions.map(function(q){ return q.id; }),
    answers: e.questions.map(function(q, i){
      var a = e.answers[i] || [];
      if(q.om) a = a.map(function(x){ return q.om[x]; });
      return a.slice();
    })
  };
  state.history.unshift(att);
  if(state.history.length > 200) state.history.length = 200;
  saveHistory();
  state.levelStage = pass ? "pass" : "fail";
  state.levelScore = score;
  renderLevelResult(pass);
}

function renderLevelResult(pass){
  var e = state.levelExam;
  var cfg = LEVELS[e.lvl];
  var score = state.levelScore;
  var doneCount = levelDoneCount();
  var h = "";
  if(pass){
    var isLast = e.lvl === LEVELS.length - 1;
    var confColors = ["#C93A2B","#C9A227","#2E8FD6","#6D3FD4","#158A5E","#B98454","#8E9AA6"];
    h += '<div class="card congrats-card">';
    h += '<div class="confetti">';
    for(var c = 0; c < 7; c++){
      h += '<i style="background:' + confColors[c % confColors.length] + ';animation-delay:' + (c * .09) + 's"></i>';
    }
    h += '</div>';
    h += '<div class="congrats-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3"/><path d="M17 6h3v2a3 3 0 0 1-3 3"/></svg></div>';
    h += '<h3>恭喜通关！</h3>';
    h += '<div class="lvl-name lvl-c' + e.lvl + '" style="display:inline-block;padding:2px 14px;border-radius:14px;color:#fff">' + cfg.name + ' · ' + cfg.title + '</div>';
    h += '<div class="congrats-score">' + fmtScore(score) + '<small> 分</small></div>';
    h += '<div class="congrats-rank"><span class="rank-badge rank-' + scoreRank(score).cls + '">评价：' + scoreRank(score).name + '</span></div>';
    h += '<div class="congrats-sub">已通关 ' + doneCount + ' / ' + LEVELS.length + ' 关</div>';
    h += '<div class="congrats-actions">';
    if(!isLast){
      h += '<button class="btn btn-primary btn-lg" id="btn-lv-next2">继续闯关 · 进入 ' + LEVELS[e.lvl + 1].name + '</button>';
      h += '<button class="btn btn-ghost btn-lg" id="btn-lv-map2">返回关卡地图</button>';
    } else {
      h += '<div class="congrats-sub" style="font-weight:700;color:var(--brand-deep)">全部七级已通关，你是斗数王者！</div>';
      h += '<button class="btn btn-primary btn-lg" id="btn-lv-map3" style="margin-top:6px">返回关卡地图</button>';
    }
    h += '</div></div>';
  } else {
    h += '<div class="card congrats-card fail">';
    h += '<div class="congrats-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg></div>';
    h += '<h3>挑战失败</h3>';
    h += '<div class="lvl-name" style="margin-bottom:8px">' + cfg.name + ' · ' + cfg.title + '</div>';
    h += '<div class="congrats-score">' + fmtScore(score) + '<small> 分</small></div>';
    h += '<div class="congrats-rank"><span class="rank-badge rank-' + scoreRank(score).cls + '">评价：' + scoreRank(score).name + '</span></div>';
    h += '<div class="congrats-sub">得分低于 60 分及格线，需重新挑战本关</div>';
    h += '<div class="congrats-actions">';
    h += '<button class="btn btn-primary btn-lg" id="btn-lv-retry">重新挑战</button>';
    h += '<button class="btn btn-ghost btn-lg" id="btn-lv-map4">返回关卡地图</button>';
    h += '</div></div>';
  }
  document.getElementById("level-box").innerHTML = h;

  var n2 = document.getElementById("btn-lv-next2");
  if(n2) n2.addEventListener("click", function(){ startLevel(e.lvl + 1); });
  var map = document.getElementById("btn-lv-map2") || document.getElementById("btn-lv-map3") || document.getElementById("btn-lv-map4");
  if(map) map.addEventListener("click", function(){ state.levelExam = null; state.levelStage = "map"; renderLevelMap(); });
  var retry = document.getElementById("btn-lv-retry");
  if(retry) retry.addEventListener("click", function(){ startLevel(e.lvl); });
}

/* =====================================================================
 * 视图：成绩记录
 * ===================================================================== */
function renderHistoryBox(){
  var hs = state.history;
  var box = document.getElementById("history-box");
  if(hs.length === 0){
    box.innerHTML = '<div class="card"><div class="h-empty">还没有考试记录，去「模拟考试」完成第一次考试吧</div></div>';
    return;
  }
  var n = hs.length;
  var passN = 0, sum = 0;
  hs.forEach(function(a){ if(a.pass) passN++; sum += a.score; });
  var h = "";
  h += '<div class="h-stats">';
  h += '<div class="stat-cell"><b>' + n + '</b><span>考试次数</span></div>';
  h += '<div class="stat-cell"><b>' + passN + '</b><span>通过次数</span></div>';
  h += '<div class="stat-cell"><b>' + Math.round(passN / n * 100) + '%</b><span>通过率</span></div>';
  h += '<div class="stat-cell"><b>' + fmtScore(sum / n) + '</b><span>平均分</span></div></div>';
  var last10 = hs.slice(0, 10).slice().reverse();
  h += '<div class="card"><div class="view-title" style="margin-bottom:2px"><h2>最近 10 次得分</h2></div><div class="bars">';
  last10.forEach(function(a){
    var sc = Math.min(100, Math.max(0, a.score));
    h += '<div class="bar-col"><div class="bar' + (a.pass ? "" : " fail") + '" style="height:' + (sc / 100 * 46 + 4) + 'px" title="' + fmtScore(a.score) + ' 分"></div><span class="bar-label">' + scoreRank(a.score).name + "</span></div>";
  });
  h += "</div></div>";
  h += '<div class="card"><div class="view-title" style="margin-bottom:10px"><h2>考试记录</h2><span class="muted">共 ' + n + " 次</span></div>";
  hs.forEach(function(a, i){
    var tag = a.mode === "level" ? '<span class="badge badge-pass" style="margin-right:6px">闯关 · ' + esc(a.levelName || "") + '</span>' : "";
    h += '<div class="h-item">';
    h += '<div class="h-score ' + (a.pass ? "pass" : "fail") + '"><b>' + fmtScore(a.score) + '</b><span>分</span></div>';
    h += '<div class="h-meta"><div class="d">' + tag + scoreRank(a.score).name + " · 答对 " + a.correct + " / " + a.total + " 题</div><div class='t'>" + fmtTime(a.t) + (a.bankTitle ? " · " + esc(a.bankTitle) : "") + "</div></div>";
    h += '<button class="btn btn-ghost" data-view-att="' + i + '">查看详情</button>';
    h += "</div>";
  });
  h += '<div class="btn-row" style="margin-top:14px"><button class="btn btn-danger" id="btn-clear-history">清空全部记录</button></div></div>';
  box.innerHTML = h;
  box.querySelectorAll("[data-view-att]").forEach(function(b){
    b.addEventListener("click", function(){
      var att = state.history[parseInt(b.getAttribute("data-view-att"), 10)];
      switchView("exam");
      state.examStage = "result";
      state.lastAtt = att;
      renderResult(att);
    });
  });
  var clr = document.getElementById("btn-clear-history");
  if(clr) clr.addEventListener("click", function(){
    if(window.confirm("确定清空全部考试记录吗？此操作不可恢复。")){
      state.history = [];
      saveHistory();
      renderHistoryBox();
      toast("记录已清空");
    }
  });
}

/* =====================================================================
 * 视图路由与初始化
 * ===================================================================== */
const VIEWS = ["exam", "level", "practice", "bank", "history"];

function renderExamStage(){
  if(state.examStage === "running" && state.exam) renderExamRunning();
  else if(state.examStage === "result") renderResult(state.lastAtt);
  else renderExamSetup();
}

function switchView(name){
  VIEWS.forEach(function(v){
    document.getElementById("view-" + v).hidden = (v !== name);
  });
  document.querySelectorAll("#tabs .tab").forEach(function(t){
    t.classList.toggle("active", t.getAttribute("data-view") === name);
  });
  if(name === "exam") renderExamStage();
  else if(name === "level") renderLevelBox();
  else if(name === "practice") renderPracticeBox();
  else if(name === "bank") renderBankBox();
  else if(name === "history") renderHistoryBox();
}

/* 初始化：迁移后的默认题库 */
(function initSelectedBank(){
  var d = state.settings.defaultBankId;
  var ok = false;
  for(var i = 0; i < state.banks.length; i++){
    if(state.banks[i].id === d){ ok = true; break; }
  }
  state.selectedBankId = ok ? d : (state.banks.length ? state.banks[0].id : null);
  /* 组卷多选：无有效记忆时回退当前题库 */
  var ids = state.selectedBankIds || [];
  var valid = ids.filter(function(id){ return getBankById(id) !== null; });
  if(!valid.length && state.selectedBankId) valid = [state.selectedBankId];
  state.selectedBankIds = valid;
})();

function saveSelectedBanks(){ LS.set(K_SEL_BANKS, state.selectedBankIds); }

updateBankName();
document.querySelectorAll("#tabs .tab").forEach(function(t){
  t.addEventListener("click", function(){ switchView(t.getAttribute("data-view")); });
});
switchView("exam");
loadExternalConfig();
renderAppLock();
loadRemoteBanks();
</script>
